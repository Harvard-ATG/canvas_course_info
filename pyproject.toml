[project]
name = "canvas-course-info"
version = "3.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=4.2.11,<5.0",
    "django-allow-cidr>=0.8.0,<1",
    "django-coursemanager",
    "django-icommons-ui",
    "django-lti>=0.7.1,<1",
    "django-lti-authentication>=0.2.0,<1",
    "django-redis==6.0.0",
    "django-ssm-parameter-store",
    "django-storages==1.14.6",
    "django-watchman==1.3.0",
    "hiredis>=3.2.1,<4",
    "psycopg2==2.9.9",
    "python-json-logger==2.0.2",
    "requests==2.27.1",
    "setuptools>=40.8.0",
    "splunk-handler==3.0.0",
    "voluptuous==0.13.1",
]

[tool.uv.sources]
django-coursemanager = { git = "ssh://git@github.com/Harvard-University-iCommons/django-coursemanager.git", rev = "v0.8" }
django-icommons-ui = { git = "ssh://git@github.com/Harvard-University-iCommons/django-icommons-ui.git", rev = "v2.1" }
django-ssm-parameter-store = { git = "ssh://git@github.com/Harvard-University-iCommons/django-ssm-parameter-store.git", rev = "v0.7" }

[tool.ruff.lint]
ignore = ["F403", "F405"]

[tool.uv]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "private-registry"
url = "https://aws@huit-academic-technology-482956169056.d.codeartifact.us-east-1.amazonaws.com/pypi/uw/simple/"

[dependency-groups]
aws = [
    "gunicorn>=23.0.0",
]
dev = [
    "ddt==1.1.1",
    "django-debug-toolbar==3.4.0",
    "django-extensions==3.1.5",
    "mock==2.0.0",
    "pyopenssl==22.0.0",
    "pyvirtualdisplay==3.0",
    "selenium==4.3.0",
    "werkzeug==2.0.3",
]